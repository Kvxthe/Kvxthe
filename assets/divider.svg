<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 28" width="830" height="28" role="img" aria-labelledby="t d">
  <title id="t">divider</title>
  <desc id="d">Decorative divider with a small nebula eye.</desc>
  <defs>
<radialGradient id="neb" cx="1" cy="0" r=".95"><stop offset="0" stop-color="#4B0082" stop-opacity=".55"/><stop offset=".55" stop-color="#4B0082" stop-opacity=".12"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
<radialGradient id="neb2" cx="0" cy="1" r=".8"><stop offset="0" stop-color="#8A2BE2" stop-opacity=".16"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
<radialGradient id="halo"><stop offset=".55" stop-color="#4B0082" stop-opacity="0"/><stop offset=".78" stop-color="#8A2BE2" stop-opacity=".55"/><stop offset=".9" stop-color="#4B0082" stop-opacity=".35"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
<radialGradient id="ring"><stop offset=".55" stop-color="#8A2BE2" stop-opacity="0"/><stop offset=".78" stop-color="#8A2BE2" stop-opacity=".9"/><stop offset=".92" stop-color="#8A2BE2" stop-opacity=".45"/><stop offset="1" stop-color="#8A2BE2" stop-opacity="0"/></radialGradient>
<radialGradient id="mid"><stop offset=".6" stop-color="#00FFFF" stop-opacity="0"/><stop offset=".82" stop-color="#00FFFF" stop-opacity=".75"/><stop offset="1" stop-color="#00BFFF" stop-opacity="0"/></radialGradient>
<radialGradient id="core"><stop offset="0" stop-color="#00FFFF" stop-opacity=".9"/><stop offset=".3" stop-color="#00BFFF" stop-opacity=".95"/><stop offset=".8" stop-color="#4B0082" stop-opacity=".85"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
<linearGradient id="bar1" x1="0" x2="1"><stop offset="0" stop-color="#8A2BE2"/><stop offset="1" stop-color="#00FFFF"/></linearGradient>
<linearGradient id="bar2" x1="0" x2="1"><stop offset="0" stop-color="#4B0082"/><stop offset="1" stop-color="#00BFFF"/></linearGradient>
<linearGradient id="bar3" x1="0" x2="1"><stop offset="0" stop-color="#4B0082"/><stop offset="1" stop-color="#8A2BE2"/></linearGradient>
<linearGradient id="col1" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#8A2BE2"/><stop offset="1" stop-color="#00FFFF"/></linearGradient>
<filter id="b6" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
<filter id="glow" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
  <style>
.m{font-family:'JetBrains Mono','DejaVu Sans Mono','Cascadia Mono',Menlo,Consolas,'Liberation Mono',monospace;font-size:12px}
.val{fill:#00BFFF} .dim{fill:#8A2BE2} .acc{fill:#8A2BE2} .cy{fill:#00FFFF} .sk{fill:#00BFFF}
.usr{fill:#8A2BE2;font-weight:700} .b{font-weight:700}
.cursor{animation:blink 1.1s steps(1) infinite} @keyframes blink{50%{opacity:0}}
.tw{animation:tw 4.5s ease-in-out infinite} @keyframes tw{0%,100%{opacity:.12}50%{opacity:.85}}
.r{opacity:0;animation:show .45s ease-out forwards} @keyframes show{from{opacity:0}to{opacity:1}}
.core{transform-box:fill-box;transform-origin:50% 50%;animation:breathe 7s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1);opacity:.92}50%{transform:scale(1.08);opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important} .r{opacity:1!important} .pend{display:none} .done{opacity:1!important} .bar,.col{transform:none!important}}
</style>
<defs><linearGradient id="dv" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="830" y2="0"><stop offset="0" stop-color="#000000"/><stop offset=".25" stop-color="#4B0082"/><stop offset=".5" stop-color="#8A2BE2"/><stop offset=".75" stop-color="#4B0082"/><stop offset="1" stop-color="#000000"/></linearGradient></defs>
<path d="M0 14H830" stroke="url(#dv)" stroke-width="1.2"/>
<g transform="translate(415 14) scale(.16)"><g transform="rotate(-14)"><ellipse rx="130" ry="88" fill="url(#halo)"/><ellipse rx="98" ry="66" fill="url(#ring)"/><ellipse rx="76" ry="52" fill="url(#mid)"/><ellipse rx="56" ry="40" fill="url(#core)"/></g></g>
</svg>
