name: update main status

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      status:
        description: "Status"
        type: choice
        default: auto
        options: [auto, online, coding, offline]
  push:
    paths: [config.json]

jobs:
  status:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: render status
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/build.py --only-status --status "${{ github.event.inputs.status || 'auto' }}"
      - name: commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/status*.svg
          git diff --staged --quiet || (git commit -m "chore: update main status" && git push)
