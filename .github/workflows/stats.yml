name: update stats cards

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [README.md, .github/workflows/stats.yml]

jobs:
  cards:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=Kvxthe&show_icons=true&theme=synthwave&hide_border=true
          path: assets/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=Kvxthe&layout=compact&langs_count=6&card_width=467&theme=synthwave&hide_border=true
          path: assets/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: commit if changed
        run: |
          git config user.name "Kvxthe"
          git config user.email "204098719+Kvxthe@users.noreply.github.com"
          git add assets/stats.svg assets/top-langs.svg
          git diff --staged --quiet || (git commit -m "chore: update stats cards" && git pull --rebase && git push)
