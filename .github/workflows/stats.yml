name: update activity card

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/**, .github/workflows/stats.yml]

jobs:
  activity:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: render activity card
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/stats.py

      - name: commit if changed
        run: |
          git config user.name "Kvxthe"
          git config user.email "204098719+Kvxthe@users.noreply.github.com"
          git add assets/stats.svg
          git diff --staged --quiet || (git commit -m "chore: update activity card" && git pull --rebase && git push)
